# Server
server.port=8080

# MongoDB Atlas
# Set MONGODB_URI as an environment variable with your Atlas connection string
# e.g. mongodb+srv://<user>:<password>@<cluster>.mongodb.net/financedb?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=false

# Google OAuth2
# Set these as environment variables: GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
# Or create src/main/resources/application-local.properties with real values
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.financetracker=DEBUG
